<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome - Recap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-arrow-repeat"></i> Recap
        </span>
        <div class="d-flex text-white align-items-center">
            <span class="me-3" th:text="'Hello, ' + ${username}"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold text-dark">What would you like to do?</h1>
        <p class="lead text-muted">Select a tool to get started</p>
    </div>

    <div class="row justify-content-center g-4">
        <div class="col-md-5">
            <div class="card h-100 border-0 shadow-sm hover-shadow text-center p-4">
                <div class="card-body">
                    <i class="bi bi-file-text display-1 text-primary mb-3"></i>
                    <h3 class="card-title">Text Summarizer</h3>
                    <p class="card-text text-muted">Condense long articles and documents into quick summaries.</p>
                    <a href="/summarizer" class="btn btn-primary btn-lg mt-3 stretched-link">Go to Summarizer</a>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card h-100 border-0 shadow-sm hover-shadow text-center p-4">
                <div class="card-body">
                    <i class="bi bi-ui-checks display-1 text-warning mb-3"></i>
                    <h3 class="card-title">MCQ Generator</h3>
                    <p class="card-text text-muted">Automatically generate multiple-choice questions from your text.</p>
                    <a href="/mcq" class="btn btn-warning btn-lg mt-3 text-white stretched-link">Go to Generator</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
